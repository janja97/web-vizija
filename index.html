<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--seo-head-->
  <meta name="author" content="Web Vizija" />
  <meta name="theme-color" content="#0f7b6c" />
  <meta name="color-scheme" content="light" />

  <!-- ═══════════════════════════════════════
       OPEN GRAPH (Facebook, LinkedIn, Viber)
  ═══════════════════════════════════════ -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Web Vizija" />
  <meta property="og:image"       content="https://webvizija.com/img/og-image.jpg" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"   content="Web Vizija — Digitalni partner" />

  <!-- ═══════════════════════════════════════
       TWITTER / X CARD
  ═══════════════════════════════════════ -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:image"       content="https://webvizija.com/img/og-image.jpg" />
  <meta name="twitter:image:alt"   content="Web Vizija — Digitalni partner" />

  <!-- ═══════════════════════════════════════
       FAVICON
  ═══════════════════════════════════════ -->
  <link rel="icon"             type="image/svg+xml"  href="/favicon.svg" />
  <link rel="icon"             type="image/png"      href="/favicon-96x96.png" sizes="96x96" />
  <link rel="apple-touch-icon"                       href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest"                               href="/site.webmanifest" />

    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JYDYBMJRN7"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-JYDYBMJRN7');
  </script>

       PRECONNECT — brže učitavanje fontova
  ═══════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
